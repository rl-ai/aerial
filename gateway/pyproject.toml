[project]
name = "secondbrain-mcp"
version = "0.1.0"
description = "The governed read path for any agent over your private notes: sensitivity labels, citation-closure checks, refuse-by-default sanitization over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.2.0,<2"]

[project.scripts]
secondbrain-mcp = "secondbrain_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["secondbrain", "secondbrain_mcp"]
