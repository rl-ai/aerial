<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 z" fill="rgba(235,235,245,0.6)"/>
</marker>
<marker id="arrowg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 z" fill="rgba(235,235,245,0.6)"/>
</marker>
<marker id="arrowb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 z" fill="rgba(235,235,245,0.6)"/>
</marker>
</defs>

<style>
:root{ }
svg{background:#000000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
/* Apple HIG dark tokens:
   canvas #000000 · elevated surface #1C1C1E · raised #2C2C2E
   systemBlue #0A84FF · systemOrange #FF9F0A · systemGray #8E8E93
   label primary #FFFFFF · secondary rgba(235,235,245,0.6)
   separator rgba(84,84,88,0.6) */
.box{fill:#1C1C1E;stroke:rgba(84,84,88,0.6);stroke-width:1}
.box.agent{stroke:#FF9F0A;stroke-width:1.5}
.box.out{stroke:#0A84FF;stroke-width:1.5}
.t{fill:#FFFFFF;font-size:12.5px;font-weight:600}
.t.small{fill:rgba(235,235,245,0.6);font-size:11px;font-weight:400}
.t.h{fill:rgba(235,235,245,0.6);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.t.orange{fill:#FF9F0A;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.t.blue{fill:#0A84FF;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
path.flow{fill:none;stroke:rgba(235,235,245,0.6);stroke-width:1.4;marker-end:url(#arrow)}
path.flow.gray{stroke:rgba(235,235,245,0.6);marker-end:url(#arrowg)}
path.flow.blue{stroke:#0A84FF;marker-end:url(#arrow)}
path.flow.loop{stroke:rgba(235,235,245,0.6);stroke-dasharray:6 4;marker-end:url(#arrow)}
text.lbl{fill:rgba(235,235,245,0.6);font-size:10.5px;font-style:italic}
text.lbl2{fill:#0A84FF;font-size:11px;font-weight:600}
</style>

<!-- legend -->
<rect x="30" y="8" width="12" height="12" rx="3" fill="#FF9F0A"/>
<text class="t small" x="48" y="18" style="fill:#FFFFFF">Agent</text>
<rect x="160" y="8" width="12" height="12" rx="3" fill="#8E8E93"/>
<text class="t small" x="178" y="18" style="fill:#FFFFFF">Local storage</text>
<rect x="290" y="8" width="12" height="12" rx="3" fill="#0A84FF"/>
<text class="t small" x="308" y="18" style="fill:#FFFFFF">Output</text>

<text class="t h" x="30" y="32">1 · Data sources</text>
<text class="t h" x="240" y="32">2 · Local storage</text>
<text class="t h" x="470" y="32">3 · Curation</text>
<text class="t h" x="680" y="32">4 · Orchestration</text>
<text class="t h" x="950" y="32">5 · Reporting</text>

<!-- flows -->
<path class="flow" d="M740,140 C 700,80 610,80 560,140"/>
<path class="flow" d="M200,88 L240,140"/>
<path class="flow" d="M200,156 L240,170"/>
<path class="flow" d="M200,224 L240,190"/>
<path class="flow" d="M200,292 L240,215"/>
<path class="flow" d="M440,190 L470,185"/>
<path class="flow" d="M650,185 L690,185"/>
<path class="flow" d="M780,230 L780,330"/>
<path class="flow" d="M870,185 L950,185"/>
<path class="flow" d="M1040,230 L1040,340"/>

<!-- COL 1: data sources -->
<rect class="box" x="30" y="60" width="170" height="56" rx="10"/>
<text class="t" x="44" y="82">Web pages</text>
<text class="t small" x="44" y="99">fetched on demand</text>

<rect class="box" x="30" y="128" width="170" height="56" rx="10"/>
<text class="t" x="44" y="150">Docs &amp; slides</text>
<text class="t small" x="44" y="167">Brief.docx · Data.xlsx</text>

<rect class="box" x="30" y="196" width="170" height="56" rx="10"/>
<text class="t" x="44" y="218">Forums &amp; releases</text>
<text class="t small" x="44" y="235">GitHub · Hugging Face</text>

<rect class="box" x="30" y="264" width="170" height="56" rx="10"/>
<text class="t" x="44" y="286">App data</text>
<text class="t small" x="44" y="303">spreadsheets · PDFs · code</text>

<!-- COL 2: local storage -->
<rect class="box store" x="240" y="120" width="200" height="180" rx="10" fill="#2C2C2E" stroke="#8E8E93"/>
<!-- mac studio icon -->
<rect x="258" y="150" width="70" height="26" rx="4" fill="#000000" stroke="#8E8E93"/>
<circle cx="270" cy="163" r="4" fill="#30D158"/>
<text class="t small" x="258" y="192" style="fill:#FFFFFF">Mac Studio</text>
<!-- dgx spark icon -->
<rect x="345" y="140" width="52" height="44" rx="4" fill="#000000" stroke="#8E8E93"/>
<line x1="352" y1="150" x2="390" y2="150" stroke="rgba(84,84,88,0.6)"/>
<line x1="352" y1="158" x2="390" y2="158" stroke="rgba(84,84,88,0.6)"/>
<line x1="352" y1="166" x2="390" y2="166" stroke="rgba(84,84,88,0.6)"/>
<circle cx="386" cy="176" r="3" fill="#30D158"/>
<text class="t small" x="345" y="200" style="fill:#FFFFFF">DGX Spark</text>
<text class="t small" x="258" y="230" style="font-style:italic">stored locally — one machine</text>
<text class="t small" x="258" y="248">workspace · files · session state</text>

<!-- COL 3: curator (AGENT overline above box) -->
<text class="t orange" x="490" y="132">Agent</text>
<rect class="box agent" x="470" y="140" width="180" height="90" rx="10"/>
<text class="t" x="490" y="166" style="font-size:14px">Curator</text>
<text class="t small" x="490" y="186">organize · analyze · label</text>
<text class="t small" x="490" y="201">what matters, what's stale</text>

<!-- COL 4: team lead -->
<text class="t orange" x="710" y="132">Agent</text>
<rect class="box agent" x="690" y="140" width="180" height="90" rx="10"/>
<text class="t" x="710" y="166" style="font-size:14px">Team Lead</text>
<text class="t small" x="710" y="186">routes the work · decides</text>
<text class="t small" x="710" y="201">what runs next</text>

<!-- action endpoints -->
<text class="t small" x="600" y="445" style="fill:#0A84FF;font-weight:600">Agent Outputs</text>
<rect class="box out" x="690" y="330" width="180" height="230" rx="10"/>
<text class="t blue" x="704" y="354">Agent actions</text>
<text class="t" x="704" y="378" style="font-weight:400">Coding</text>
<text class="t small" x="704" y="394">fix bugs · build features</text>
<text class="t" x="704" y="418" style="font-weight:400">Docs &amp; slides</text>
<text class="t small" x="704" y="434">organize · generate</text>
<text class="t" x="704" y="458" style="font-weight:400">Research</text>
<text class="t small" x="704" y="474">find facts · cite sources</text>
<text class="t" x="704" y="498" style="font-weight:400">Scheduled tasks</text>
<text class="t small" x="704" y="514">recurring · background</text>

<!-- COL 5: exec + report -->
<text class="t orange" x="970" y="132">Agent</text>
<rect class="box agent" x="950" y="140" width="180" height="90" rx="10"/>
<text class="t" x="970" y="166" style="font-size:14px">Exec / Chief of Staff</text>
<text class="t small" x="970" y="186">distills everything into</text>
<text class="t small" x="970" y="201">what you need to know</text>

<rect class="box out" x="950" y="340" width="180" height="110" rx="10"/>
<text class="t blue" x="970" y="364">Exec report</text>
<text class="t small" x="970" y="384">— todo list</text>
<text class="t small" x="970" y="401">— dashboard</text>
<text class="t small" x="970" y="418">— weekly summary</text>
<text class="t small" x="970" y="435">— what changed &amp; why</text>

<!-- connector labels -->
<text class="lbl" x="443" y="172">context</text>
<text class="lbl" x="655" y="172">gap analysis</text>
<text class="lbl" x="880" y="172">briefs · results</text>
<text class="lbl" x="545" y="88">what to look for next</text>

<!-- bottom note -->
<rect x="30" y="590" width="1100" height="70" rx="10" fill="#1C1C1E" stroke="rgba(84,84,88,0.6)"/>
<text class="t small" x="50" y="618">Everything runs on one machine, for one user. The curator, lead, and exec share a single conversation's</text>
<text class="t small" x="50" y="636">context — there is no shared task store between agents, no evidence trail beyond the chat, and no</text>
<text class="t small" x="50" y="654">fleet management: the harness and its surface are one app.</text>

<!-- hairline separator -->
<line x1="660" y1="300" x2="1150" y2="300" stroke="rgba(84,84,88,0.6)" stroke-width="1" stroke-dasharray="5 5"/>
</svg>
